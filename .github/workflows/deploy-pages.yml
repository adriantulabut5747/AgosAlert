# Builds the Flutter web app and publishes it to
# https://adriantulabut5747.github.io/AgosAlert/ on every push to main.
name: Deploy to GitHub Pages

# When to run: on every push to main, or by hand ("workflow_dispatch" adds
# a "Run workflow" button on GitHub's Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

# What this workflow is allowed to do: read the code, publish to Pages.
# id-token lets GitHub Pages check that the upload really comes from this
# repo's workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push again while a deploy is still running, cancel the old one
# and only publish the newest version.
concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs: "build" makes the website files, then "deploy" (which waits
# for build via `needs: build`) publishes them.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Download this repo's code onto GitHub's temporary build machine.
      - uses: actions/checkout@v4

      # Install Flutter (latest stable). cache: true reuses the download
      # from the last run, so builds are faster.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Download the packages listed in pubspec.yaml (flutter_map, http...).
      - run: flutter pub get

      # base-href must match the repo name, because Pages serves the site
      # from /AgosAlert/, not from the domain root.
      - run: flutter build web --release --base-href /AgosAlert/

      # Package the finished website (build/web) for the deploy job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
