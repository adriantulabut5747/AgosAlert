<!doctype html>
<!--
  Tugak's 3D stage for the phone app (Nov 20 2026). The APK/IPA can't run
  three.js itself, so lib/widgets/tugak_stage_io.dart shows THIS page from the
  live site in a WebView and drives it with the same calls as the web app
  (tugak_stage_web.dart): start(opts), then stage.setWeather(...), say(...)...
  It tells the app back through the `Agos` channel: "ready" or "error:...".
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <!-- scene.js loads its fonts from assets/assets/fonts/ (relative to app/) -->
    <base href="../" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #s {
        position: relative;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
    <script type="module" src="tugak/scene.js"></script>
  </head>
  <body>
    <div id="s"></div>
    <script>
      function post(m) {
        if (window.Agos) Agos.postMessage(m);
      }
      function start(opts) {
        if (window.stage) return;
        if (!window.agosTugak) return post('error:scene.js did not load');
        window.stage = agosTugak.create(document.getElementById('s'), opts, {
          onReady: function () {
            post('ready');
          },
          onError: function (e) {
            post('error:' + e);
          },
        });
      }
    </script>
  </body>
</html>
