<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` value given to
    `flutter build` (e.g. /AgosAlert/ on GitHub Pages).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgosAlert: live weather, flood outlook, and emergency help for Mabalacat City, Pampanga.">
  <meta name="theme-color" content="#0B1130">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AgosAlert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    SPEED: start every download right away, all at the same time.
    Without these, the browser only discovers the app code, fonts, and
    asset lists one step after another as Flutter starts up.
  -->
  <!-- Flutter's drawing engine (CanvasKit) comes from Google's CDN. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- The app itself. -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- Lists of fonts/images, and the fonts (normally fetched only after
       the engine has started). -->
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-ExtraBold.ttf" as="fetch" crossorigin>

  <title>AgosAlert · Mabalacat City</title>
  <link rel="manifest" href="manifest.json">

  <!--
    LOADING SCREEN = a "skeleton" of the login page.
    Plain HTML/CSS, so it shows instantly while Flutter downloads. Its
    layout matches the real login screen, so when flutter_bootstrap.js
    fades it out, the real page appears in the same place.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #060911; }

    #loader {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0B1130 0%, #060911 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #loader.done { opacity: 0; visibility: hidden; }

    /* Soft glows, same as the app background */
    #loader::before, #loader::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    }
    #loader::before {
      width: 340px; height: 340px; top: -140px; right: -120px;
      background: radial-gradient(circle, rgba(45,125,210,.22), transparent 70%);
    }
    #loader::after {
      width: 320px; height: 320px; bottom: 80px; left: -160px;
      background: radial-gradient(circle, rgba(41,197,246,.16), transparent 70%);
    }

    /* Thin progress bar along the top */
    .progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 3; }
    .progress span {
      display: block; height: 100%; width: 8%;
      background: linear-gradient(90deg, #2D7DD2, #29C5F6);
      box-shadow: 0 0 12px rgba(41,197,246,.8);
      border-radius: 0 3px 3px 0;
      transition: width .8s cubic-bezier(.22,1,.36,1);
    }

    /* Same sizes and spacing as the Flutter login screen */
    .page {
      position: relative; z-index: 2; width: 100%; max-width: 420px;
      padding: 24px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo { height: 170px; filter: drop-shadow(0 0 40px rgba(41,197,246,.25)); }
    .logo-fallback { width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, #2D7DD2, #29C5F6); margin: 37px 0; }
    .tagline { margin-top: 10px; font-size: 13px; font-weight: 500; color: #9FB4CC; }
    .card {
      margin-top: 28px; width: 100%; box-sizing: border-box;
      padding: 26px 22px 22px; border-radius: 24px;
      background: rgba(16,24,40,.62); border: 1px solid rgba(255,255,255,.1);
    }
    .status {
      margin-top: 18px; font-size: 12px; color: #9FB4CC; min-height: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #29C5F6;
      box-shadow: 0 0 8px #29C5F6; animation: pulse 1.2s ease-in-out infinite; }

    /* Skeleton blocks with a light sweeping across (shimmer) */
    .sk {
      border-radius: 16px; background: #16223A; position: relative; overflow: hidden;
    }
    .sk::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      animation: shimmer 1.3s ease-in-out infinite;
    }
    .sk.btn { background: linear-gradient(90deg, rgba(45,125,210,.55), rgba(41,197,246,.55)); }
    .sk.btn::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); }
    .sk.line { border-radius: 6px; }
    .sk.outline { background: transparent; border: 1px solid rgba(255,255,255,.08); }
    .row { display: flex; align-items: center; gap: 12px; }
    .divider { flex: 1; height: 1px; background: rgba(255,255,255,.08); }

    /* Layered waves at the bottom, like the app's login screen */
    .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 1; }
    .waves svg { position: absolute; bottom: 0; width: 200%; height: 100%; }
    .waves .w1 { animation: slide 14s linear infinite; opacity: .3; }
    .waves .w2 { animation: slide 10s linear infinite reverse; opacity: .4; }
    .waves .w3 { animation: slide 7s linear infinite; opacity: .55; height: 70%; }

    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes shimmer { to { transform: translateX(100%); } }
    @keyframes pulse { 50% { opacity: .35; } }

    /* Respect "reduce motion" accessibility settings */
    @media (prefers-reduced-motion: reduce) {
      #loader *, #loader *::before, #loader *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite" aria-label="Loading AgosAlert">
    <div class="progress"><span id="loaderBar"></span></div>

    <div class="page">
      <img class="logo" src="assets/assets/images/logo_icon_dark.png" alt="AgosAlert"
           onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;></div>'">
      <div class="tagline">Flood Monitoring &amp; Emergency Assistance</div>

      <div class="card" aria-hidden="true">
        <div class="sk line" style="width:170px;height:22px"></div>
        <div class="sk line" style="width:140px;height:12px;margin-top:10px"></div>
        <div class="sk" style="height:54px;margin-top:22px"></div>
        <div class="sk" style="height:54px;margin-top:12px"></div>
        <div class="sk line" style="width:110px;height:12px;margin:18px 0 18px auto"></div>
        <div class="sk btn" style="height:54px"></div>
        <div class="row" style="margin:20px 0"><div class="divider"></div><div class="divider"></div></div>
        <div class="sk outline" style="height:52px"></div>
        <div class="sk line" style="width:120px;height:12px;margin:22px auto 6px"></div>
      </div>

      <div class="status"><span class="dot"></span><span id="loaderStatus">Loading AgosAlert…</span></div>
    </div>

    <div class="waves" aria-hidden="true">
      <svg class="w1" viewBox="0 0 1440 150" preserveAspectRatio="none"><path fill="#2D7DD2" d="M0 60 C180 20 540 100 720 60 C900 20 1260 100 1440 60 V150 H0Z"/></svg>
      <svg class="w2" viewBox="0 0 1440 150" preserveAspectRatio="none"><path fill="#29C5F6" d="M0 85 C120 115 240 55 360 85 C480 115 600 55 720 85 C840 115 960 55 1080 85 C1200 115 1320 55 1440 85 V150 H0Z"/></svg>
      <svg class="w3" viewBox="0 0 1440 150" preserveAspectRatio="none"><path fill="#2D7DD2" d="M0 90 C240 50 480 130 720 90 C960 50 1200 130 1440 90 V150 H0Z"/></svg>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
